services:
  probe:
    build: .
    image: telemetry-udp-probe:latest
    ports:
      - "8000:8000"        # HTTP API / /docs
      - "9999:9999/udp"    # 本地回显端（容器内探测默认走 127.0.0.1，此映射供宿主机手工验证）
      - "9998:9998/udp"    # 遥测本地接收器（合包数据报落地端口，供宿主机抓包/手工验证）
    environment:
      ECHO_HOST: 0.0.0.0        # 回显端监听地址
      ECHO_PORT: "9999"         # 回显端 UDP 端口
      PROBE_TARGET_HOST: 127.0.0.1  # 探测默认目标（容器内本地回显端）
      TELEMETRY_HOST: 0.0.0.0       # 遥测接收器监听地址
      TELEMETRY_PORT: "9998"        # 遥测接收器 UDP 端口
      TELEMETRY_TARGET_HOST: 127.0.0.1  # 合包发送目标（容器内本地接收器）
    restart: unless-stopped
